<script>
document.addEventListener('DOMContentLoaded', function () {
  // 1) 저자 뒤 "(연도)." 텍스트 제거
  document.querySelectorAll('.pub-list-item.view-citation').forEach(function (item) {
    Array.from(item.childNodes).forEach(function (node) {
      if (node.nodeType === Node.TEXT_NODE && /^\(\d{4}\)\.\s*$/.test(node.textContent.trim())) {
        node.textContent = '';
      }
    });
  });

  // 2) 랩 멤버 등록부 — 새 멤버 합류 시 여기에 한 줄만 추가하면 끝
  var labMembers = {
    'Junyoung Kwon': '/author/junyoung-kwon-ph.d./'
    // 'Jane Doe': '/author/jane-doe/'
  };
  document.querySelectorAll('.article-metadata.li-cite-author a[href*="/author/"]').forEach(function (a) {
    var matchedUrl = null;
    for (var name in labMembers) {
      if (a.textContent.indexOf(name) !== -1) {
        matchedUrl = labMembers[name];
        break;
      }
    }
    if (matchedUrl) {
      a.setAttribute('href', matchedUrl);
    } else {
      var textNode = document.createTextNode(a.textContent);
      a.parentNode.replaceChild(textNode, a);
    }
  });

  // 3) Selected Publications 카드에서만 " — Highlighted..." 이후 텍스트 잘라내기
  document.querySelectorAll('.selected-pubs .pub-publication').forEach(function (el) {
    var html = el.innerHTML;
    var idx = html.indexOf(' — ');
    if (idx !== -1) {
      el.innerHTML = html.substring(0, idx);
    }
  });

  // 4) People 카드의 관심분야를 콤마로 나눠 태그(pill) 형태로 표시
  document.querySelectorAll('.people-widget .people-interests').forEach(function (el) {
    var items = el.textContent.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    el.innerHTML = '';
    items.forEach(function (item) {
      var li = document.createElement('li');
      li.className = 'interest-tag';
      li.textContent = item;
      el.appendChild(li);
    });
  });

  // 5) 홈페이지 히어로 캐러셀 (자동 재생 + 점/화살표 네비게이션)
  var hero = document.getElementById('sim-hero');
  if (hero) {
    var slides = Array.prototype.slice.call(hero.querySelectorAll('.sim-hero__slide'));
    var dots = Array.prototype.slice.call(hero.querySelectorAll('.sim-hero__dot'));
    var prevBtn = hero.querySelector('.sim-hero__arrow--prev');
    var nextBtn = hero.querySelector('.sim-hero__arrow--next');
    var current = 0;
    var timer = null;
    var AUTOPLAY_MS = 6500;

    function applyAccent(slide) {
      var accent = slide.getAttribute('data-accent');
      var colors = { cyan: '#22d3ee', violet: '#a78bfa', amber: '#fb923c' };
      hero.style.setProperty('--hero-accent', colors[accent] || colors.cyan);
    }

    function goTo(index) {
      if (!slides.length) return;
      index = (index + slides.length) % slides.length;
      slides[current].classList.remove('is-active');
      dots[current] && dots[current].classList.remove('is-active');
      current = index;
      slides[current].classList.add('is-active');
      dots[current] && dots[current].classList.add('is-active');
      applyAccent(slides[current]);
    }

    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    function startAutoplay() {
      stopAutoplay();
      if (slides.length > 1) timer = setInterval(next, AUTOPLAY_MS);
    }
    function stopAutoplay() {
      if (timer) { clearInterval(timer); timer = null; }
    }
    function restartAutoplay() {
      stopAutoplay();
      startAutoplay();
    }

    if (slides.length) applyAccent(slides[current]);

    dots.forEach(function (dot, i) {
      dot.addEventListener('click', function () { goTo(i); restartAutoplay(); });
    });
    if (nextBtn) nextBtn.addEventListener('click', function () { next(); restartAutoplay(); });
    if (prevBtn) prevBtn.addEventListener('click', function () { prev(); restartAutoplay(); });

    hero.addEventListener('mouseenter', stopAutoplay);
    hero.addEventListener('mouseleave', startAutoplay);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopAutoplay(); else startAutoplay();
    });

    startAutoplay();
  }

  // 6) 홈페이지 네비게이션 바 — 히어로 위에서는 투명, 스크롤하면 불투명하게 전환
  if (document.body.classList.contains('home')) {
    var HERO_SCROLL_THRESHOLD = 80;
    var navToggler = document.querySelector('.navbar-toggler');
    var menuOpen = false;

    function updateNavbarState() {
      var solid = menuOpen || window.scrollY > HERO_SCROLL_THRESHOLD;
      document.body.classList.toggle('navbar-scrolled', solid);
    }

    window.addEventListener('scroll', updateNavbarState, { passive: true });
    if (navToggler) {
      navToggler.addEventListener('click', function () {
        menuOpen = !menuOpen;
        updateNavbarState();
      });
    }
    updateNavbarState();
  }
});
</script>
