<script>
document.addEventListener('DOMContentLoaded', function () {
  // 1) 저자 뒤 "(연도)." 텍스트 제거 (기존 기능 유지)
  document.querySelectorAll('.pub-list-item.view-citation').forEach(function (item) {
    Array.from(item.childNodes).forEach(function (node) {
      if (node.nodeType === Node.TEXT_NODE && /^\(\d{4}\)\.\s*$/.test(node.textContent.trim())) {
        node.textContent = '';
      }
    });
  });

  // 2) 랩 멤버 이름만 링크 유지, 나머지는 링크 해제 (이름 텍스트 기준으로 판단)
  var labMemberNames = ['Junyoung Kwon']; // ← 새 랩 멤버 추가 시 여기에 이름 추가 (콤마로 구분)

  function isLabMember(text) {
    return labMemberNames.some(function (name) {
      return text.indexOf(name) !== -1;
    });
  }

  document.querySelectorAll('.article-metadata.li-cite-author a[href*="/author/"]').forEach(function (a) {
    if (!isLabMember(a.textContent)) {
      var textNode = document.createTextNode(a.textContent);
      a.parentNode.replaceChild(textNode, a);
    }
  });
});
</script>
